name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + unit tests (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.8
          actions-cache-folder: .xmake-cache

      - name: Install WDK via NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nupkg = Join-Path $env:RUNNER_TEMP 'wdk.nupkg'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Windows.WDK.x64/10.0.26100.6584' -OutFile $nupkg
          $root = Join-Path $env:RUNNER_TEMP 'wdk'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar.exe -xf $nupkg -C $root
          # The package contains one directory with Include/ and Lib/.
          $candidate = Get-ChildItem -Path $root -Directory -Recurse |
            Where-Object { (Test-Path (Join-Path $_.FullName 'Include')) -and (Test-Path (Join-Path $_.FullName 'Lib')) } |
            Select-Object -First 1
          if ($null -eq $candidate) { throw 'WDK layout not found in NuGet package' }
          "WDK_DIR=$($candidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "WDK_DIR=$($candidate.FullName)"
          Get-ChildItem (Join-Path $candidate.FullName 'Include') | Select-Object -First 5 Name

      - name: Configure
        shell: pwsh
        run: |
          xmake f -y -m release --wdk="$env:WDK_DIR"
          xmake show -l targets

      - name: Build (user lib, kernel lib, unit tests, guest tools)
        shell: pwsh
        run: xmake -y -v

      - name: Host unit tests
        shell: pwsh
        run: |
          xmake run kchannel-unit-tests
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed: $LASTEXITCODE" }

      - name: Collect build outputs
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'kchannel-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $release = 'build/windows/x64/release'
          Get-ChildItem $release -Include *.lib,*.exp -File | Copy-Item -Destination $out
          Get-ChildItem $release -Include *.sys,*.exe -File | Copy-Item -Destination $out
          Get-ChildItem $out | Select-Object Name,Length
          "OUT_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: kchannel-windows-x64
          path: |
            build/windows/x64/release/*.lib
            build/windows/x64/release/*.sys
            build/windows/x64/release/kchannel-unit-tests.exe
            build/windows/x64/release/kchannel-ctl.exe
          if-no-files-found: error

  format:
    name: clang-format check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned clang-format
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'clang-format==20.1.0'
          clang-format --version

      - name: Check formatting
        shell: pwsh
        run: pwsh scripts/check-format.ps1

  host-safety:
    name: host-safety gate (no kernel code on runners)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse host kernel execution
        shell: pwsh
        run: pwsh scripts/check-host-safety.ps1
  package:
    name: package source + binary artifacts
    runs-on: windows-latest
    needs: [build, format]
    steps:
      - uses: actions/checkout@v4
      - name: Stage package
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $stage = Join-Path $env:RUNNER_TEMP 'pkg'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item include -Destination $stage -Recurse
          Copy-Item src -Destination $stage -Recurse
          Copy-Item docs/integration.md -Destination $stage -Recurse
          Copy-Item version.txt,LICENSE -Destination $stage
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'xmake-package') | Out-Null
          Copy-Item xmake-package/xmake.lua -Destination (Join-Path $stage 'xmake-package')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "blook-kchannel-$version-src.zip" -Force
          $hash = (Get-FileHash "blook-kchannel-$version-src.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  blook-kchannel-$version-src.zip" | Out-File -Encoding ascii "blook-kchannel-$version-src.zip.sha256"
          Get-ChildItem *.zip* | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: kchannel-src-package
          path: |
            blook-kchannel-*-src.zip
            blook-kchannel-*-src.zip.sha256
          if-no-files-found: error

  kernel-e2e:
    # HOST-SAFETY-ALLOW: ci-kernel-smoke
    # Full kchannel feature matrix on a disposable hosted runner (admin,
    # SPC SHA-1 signing, no VT-x needed). The physical host still refuses to
    # load kernel code; this job is the CI-runners-only exception.
    name: kernel-e2e (full matrix on hosted runner)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.8
          actions-cache-folder: .xmake-cache

      - name: Install WDK via NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nupkg = Join-Path $env:RUNNER_TEMP 'wdk.nupkg'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Windows.WDK.x64/10.0.26100.6584' -OutFile $nupkg
          $root = Join-Path $env:RUNNER_TEMP 'wdk'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar.exe -xf $nupkg -C $root
          $candidate = Get-ChildItem -Path $root -Directory -Recurse |
            Where-Object { (Test-Path (Join-Path $_.FullName 'Include')) -and (Test-Path (Join-Path $_.FullName 'Lib')) } |
            Select-Object -First 1
          if ($null -eq $candidate) { throw 'WDK layout not found in NuGet package' }
          "WDK_DIR=$($candidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure and build
        shell: pwsh
        run: |
          xmake f -y -m release --wdk="$env:WDK_DIR"
          xmake -y
          if ($LASTEXITCODE -ne 0) { throw "build failed: $LASTEXITCODE" }

      - name: Import SPC signing certificate
        shell: pwsh
        env:
          SPC_PFX_BASE64: ${{ secrets.SPC_PFX_BASE64 }}
          SPC_PFX_PASSWORD: ${{ secrets.SPC_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'spc.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SPC_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SPC_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          # Legacy cross-signed kernel policy: TSA root + VeriSign CA chain must
          # be trusted or both /kp and the load fail (0x80096005 / 577).
          certutil -addstore -f root signer\tsa\tsa-root.cer
          certutil -addstore -f CA signer\certs\verisign-cscs-2010.cer
          certutil -addstore -f CA signer\certs\verisign-g5-mcvr.cer
          $xinda = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -match 'XINDA' } | Select-Object -First 1
          Export-Certificate -Cert $xinda -FilePath (Join-Path $env:RUNNER_TEMP 'xinda.cer') -Type CERT | Out-Null

      - name: Sign drivers (SPC SHA-1) and create the e2e bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'kc-bundle'
          Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          $driver = Join-Path $PWD 'build/windows/x64/release/kchannel_test.sys'
          $mapper = Join-Path $PWD 'build/windows/x64/release/kcmapload.sys'
          $ctl = Join-Path $PWD 'build/windows/x64/release/kchannel-ctl.exe'
          & pwsh -NoProfile -File scripts/sign-driver.ps1 -ImportTsaRoot -Sha1 -Driver ($driver + ',' + $mapper)
          if ($LASTEXITCODE -ne 0) { throw 'SPC signing failed' }
          Copy-Item $driver $bundle -Force
          Copy-Item $mapper $bundle -Force
          Copy-Item $ctl $bundle -Force
          Copy-Item 'tests/e2e/guest-run.ps1' $bundle -Force
          Copy-Item 'signer/tsa/tsa-root.cer' $bundle -Force
          Copy-Item 'signer/certs/verisign-cscs-2010.cer' $bundle -Force
          Copy-Item 'signer/certs/verisign-g5-mcvr.cer' $bundle -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'xinda.cer') (Join-Path $bundle 'blook-kchannel-xinda.cer') -Force
          "KC_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $bundle | Select-Object Name, Length

      - name: Run full e2e matrix (host mode)
        shell: pwsh
        env:
          BLOOK_CI_HOST_E2E: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:KC_BUNDLE
          try {
              & pwsh -NoProfile -File (Join-Path $env:KC_BUNDLE 'guest-run.ps1') 2>&1 |
                  Tee-Object -FilePath (Join-Path $env:KC_BUNDLE 'stdout.txt')
              $runExit = $LASTEXITCODE
          }
          finally {
              Pop-Location
              foreach ($name in @('kcmapload', 'kchannel_test')) {
                  sc.exe stop $name 2>&1 | Out-Null
                  sc.exe delete $name 2>&1 | Out-Null
              }
          }
          $results = Join-Path $env:KC_BUNDLE 'results.jsonl'
          if (-not (Test-Path $results)) { throw 'results.jsonl missing' }
          $rows = Get-Content $results | Where-Object { $_ -and ($_ -match '"name"') } | ForEach-Object { $_ | ConvertFrom-Json }
          $failures = @($rows | Where-Object { $_.ok -eq $false })
          Write-Host "e2e rows: $($rows.Count), failures: $($failures.Count)"
          foreach ($row in $failures) { Write-Host ("FAILED: " + $row.name + ' :: ' + $row.detail) }
          if ($rows.Count -lt 10) { throw 'matrix did not run (too few rows)' }
          if ($failures.Count -ne 0) { throw 'e2e matrix reported failures' }
          if ($runExit -ne 0) { throw "guest-run exit code $runExit" }
          $skipCases = @(
              [ordered]@{ name = 'crash_bsod_scm'; status = 'skip'; reason = 'requires VM reboot/BSOD' },
              [ordered]@{ name = 'crash_bsod_mapped'; status = 'skip'; reason = 'requires VM reboot/BSOD' }
          )
          $caseRows = @()
          foreach ($row in $rows) {
              $caseRows += [ordered]@{
                  name   = $row.name
                  status = if ($row.ok) { 'pass' } else { 'fail' }
                  detail = [string]$row.detail
              }
          }
          $passed = @($caseRows | Where-Object { $_.status -eq 'pass' }).Count
          $failedCount = @($caseRows | Where-Object { $_.status -eq 'fail' }).Count
          $summary = [ordered]@{
              schema    = 'blook-kchannel.ci-e2e.v1'
              runner    = $env:RUNNER_OS
              commit    = $env:GITHUB_SHA
              timestamp = (Get-Date -Format o)
              counts    = [ordered]@{ passed = $passed; failed = $failedCount; skipped = $skipCases.Count }
              failures  = $failedCount
              cases     = @($caseRows) + @($skipCases)
          }
          $summary | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:KC_BUNDLE 'ci-e2e-result.json')
          Write-Host ('ci-e2e-result.json: passed=' + $passed + ' failed=' + $failedCount + ' skipped=' + $skipCases.Count)
          Write-Host 'kernel-e2e: PASS'

      - name: Upload kernel-e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-e2e-${{ github.sha }}
          path: |
            ${{ env.KC_BUNDLE }}
            C:\blook-kchannel-e2e.log
          if-no-files-found: warn
